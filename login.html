<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"><script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="js/config.js"></script><script defer src="js/supabase.js"></script><script defer src="js/app.js"></script><script defer src="js/auth.js"></script><title>STO KA | Entrar</title></head><body data-page="login" class="min-h-screen grid place-items-center p-5"><main class="card w-full max-w-md"><a href="login.html" class="text-2xl font-extrabold">📦 STO KA</a><h1 class="text-2xl font-bold mt-7 mb-2">Entrar</h1><p class="text-sm text-slate-500 mb-6">Acesse sua empresa com e-mail e senha.</p><form id="login-form"><label for="email" class="block text-sm font-medium mb-1">E-mail</label><input id="email" name="email" class="field mb-4" type="email" autocomplete="email" maxlength="254" required><label for="senha" class="block text-sm font-medium mb-1">Senha</label><input id="senha" name="senha" class="field mb-5" type="password" minlength="8" autocomplete="current-password" required><button type="submit" class="btn btn-primary w-full">Entrar</button></form><p class="text-center text-sm mt-6">Ainda não tem conta? <a class="text-teal-700 font-semibold" href="cadastro.html">Criar conta</a></p></main></body></html>
