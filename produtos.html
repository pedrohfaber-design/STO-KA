<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STO KA | Produtos</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"><script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="js/config.js"></script><script defer src="js/supabase.js"></script><script defer src="js/app.js"></script><script defer src="js/auth.js"></script><script defer src="js/produtos.js"></script></head><body data-page="protected" hidden><header class="bg-white border-b p-5"><div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-3"><a href="index.html" class="font-extrabold text-xl">📦 STO KA</a><div class="flex items-center gap-4"><span id="empresa-atual" class="text-sm text-slate-500"></span><a href="index.html" class="text-teal-700 font-semibold">← Voltar ao painel</a></div></div></header><main class="max-w-6xl mx-auto p-5 md:p-10"><div class="mb-7"><h1 class="text-3xl font-bold">Produtos e categorias</h1><p class="text-slate-500 mt-1">Cadastre e gerencie o estoque da sua empresa.</p></div><div id="feedback" role="status" aria-live="polite" class="text-sm text-slate-500 mb-5">Carregando...</div><div class="grid lg:grid-cols-3 gap-5"><section class="card lg:col-span-1"><h2 class="text-xl font-bold mb-4">Categorias</h2><form id="categoria-form" class="space-y-3"><label for="categoria-nome" class="block text-sm font-medium">Nome da categoria</label><input id="categoria-nome" name="nome" class="field" minlength="2" maxlength="100" required placeholder="Ex.: Periféricos"><button class="btn btn-primary w-full" type="submit">Adicionar categoria</button></form><ul id="categorias-lista" class="mt-5 divide-y divide-slate-100" aria-label="Categorias cadastradas"></ul></section><section class="card lg:col-span-2"><h2 class="text-xl font-bold mb-4">Cadastrar produto</h2><form id="produto-form" class="grid sm:grid-cols-2 gap-4"><div><label for="codigo" class="block text-sm font-medium mb-1">Código *</label><input id="codigo" name="codigo" class="field" maxlength="60" required placeholder="PROD-001"></div><div><label for="nome" class="block text-sm font-medium mb-1">Nome *</label><input id="nome" name="nome" class="field" minlength="2" maxlength="200" required></div><div><label for="categoria" class="block text-sm font-medium mb-1">Categoria</label><select id="categoria" name="categoria" class="field"><option value="">Sem categoria</option></select></div><div><label for="quantidade" class="block text-sm font-medium mb-1">Quantidade inicial *</label><input id="quantidade" name="quantidade" type="number" min="0" step="1" value="0" class="field" required></div><div><label for="estoque-minimo" class="block text-sm font-medium mb-1">Estoque mínimo *</label><input id="estoque-minimo" name="estoque_minimo" type="number" min="0" step="1" value="0" class="field" required></div><div><label for="preco-custo" class="block text-sm font-medium mb-1">Preço de custo (R$)</label><input id="preco-custo" name="preco_custo" type="number" min="0" step="0.01" class="field" placeholder="0,00"></div><div><label for="preco-venda" class="block text-sm font-medium mb-1">Preço de venda (R$)</label><input id="preco-venda" name="preco_venda" type="number" min="0" step="0.01" class="field"></div><div class="sm:col-span-2"><label for="descricao" class="block text-sm font-medium mb-1">Descrição</label><textarea id="descricao" name="descricao" rows="2" class="field"></textarea></div><div class="sm:col-span-2"><button class="btn btn-primary w-full sm:w-auto" type="submit">Salvar produto</button></div></form></section></div><section class="card mt-6"><div class="flex flex-wrap gap-3 justify-between items-center mb-4"><h2 class="text-xl font-bold">Produtos cadastrados</h2><label class="text-sm">Pesquisar <input id="pesquisa" type="search" class="field mt-1" placeholder="Código ou nome"></label></div><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="border-b bg-slate-50"><tr><th class="p-3">Código</th><th class="p-3">Produto</th><th class="p-3">Categoria</th><th class="p-3">Estoque</th><th class="p-3">Mínimo</th><th class="p-3">Ação</th></tr></thead><tbody id="produtos-lista"><tr><td colspan="6" class="p-6 text-center text-slate-500">Carregando produtos...</td></tr></tbody></table></div></section></main><button type="button" data-logout class="fixed right-4 bottom-4 z-50 btn btn-outline shadow-lg">Sair da conta</button></body></html>
